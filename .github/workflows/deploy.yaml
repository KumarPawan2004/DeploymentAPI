name: Backend CI/CD

on:
  push:
    branches: [Dev]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/deployment-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    
    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.DOCKER_IMAGE }}:latest
          ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to AKS
      run: |
        az aks get-credentials --resource-group deployment-rg --name deployment-aks
        kubectl set image deployment/backend backend=${{ env.DOCKER_IMAGE }}:${{ github.sha }}